<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Youtify Music Player</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="./styles.css" />
    <script
      type="module"
      src="./index.js"></script>

    <!-- favicon -->
    <link
      rel="icon"
      href="./assets/favicon.png" />
  </head>
  <body>
    <div class="container">
      <!-- Mobile Menu -->
      <button class="mobile-menu-btn1">
        <i class="fas fa-bars"></i>
      </button>
      <!-- Sidebar -->
      <aside class="sidebar">
        <button class="close-sidebar-btn">
          <i class="fas fa-times"></i>
        </button>
        <div class="logo">
          <div class="logo-icon">
            <!-- <i class="fas fa-wave-square"></i> -->
            <img
              src="./assets/logo.png"
              alt="logo" />
          </div>
          <span>Youtify</span>
        </div>

        <nav class="nav-menu">
          <a href="#">
            <i class="fas fa-compact-disc"></i>
            <span>Discover</span>
          </a>
          <a href="/Music%20App/#">
            <i class="fas fa-clock"></i>
            <span>Recent</span>
          </a>
        </nav>
        <div class="playlists">
          <h3>Your Playlists</h3>
          <div class="playlist-list">
            <!-- Playlists will be dynamically added here -->
          </div>
          <button class="create-playlist">
            <i class="fas fa-plus"></i> Create Playlist
          </button>
        </div>
      </aside>
      <!-- Loading Overlay -->
      <div class="loading-overlay">
        <i class="fas fa-spinner fa-spin"></i>
      </div>

      <!-- Error Message -->
      <div class="error-message"></div>

      <!-- Main Content -->
      <main class="main-content">
        <header class="main-header">
          <!-- Mobile Menu -->
          <button class="mobile-menu-btn">
            <i class="fas fa-bars"></i>
          </button>
          <div class="search-bar">
            <i class="fas fa-search"></i>
            <input
              type="text"
              placeholder="Search songs, artists..." />
          </div>

          <button class="theme-toggle">
            <i class="fas fa-moon"></i>
          </button>
        </header>

        <section class="music-grid">
          <h2>Recently Played</h2>
          <div class="grid-container">
            <!-- Music Cards -->
            <div class="music-card">
              <div class="album-art">
                <img
                  src="./assets/image.png"
                  alt="Album cover" />
                <button class="play-btn">
                  <i class="fas fa-play"></i>
                </button>
              </div>
              <div class="song-info">
                <h4>Midnight City</h4>
                <p>The Electric Waves</p>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Player Controls -->
      <div class="player-controls">
        <div class="player-left">
          <div class="current-track">
            <img
              src="./assets/image.png"
              alt="Current song" />
            <div class="track-info">
              <h4>Starlight Journey</h4>
              <p>Digital Horizon</p>
            </div>
            <i class="fas fa-heart"></i>
          </div>
        </div>

        <div class="player-center">
          <div class="playback-controls">
            <div class="controls">
              <button class="control-btn shuffle">
                <i class="fas fa-random"></i>
              </button>
              <button class="control-btn prev">
                <i class="fas fa-step-backward"></i>
              </button>
              <button class="control-btn play">
                <i class="fas fa-play"></i>
              </button>
              <button class="control-btn next">
                <i class="fas fa-step-forward"></i>
              </button>
              <button class="control-btn repeat">
                <i class="fas fa-redo"></i>
              </button>
            </div>
            <div class="progress-container">
              <span class="time">2:15</span>
              <!-- TODO: Change to input range -->
              <!-- <div class="progress-bar"> -->
              <input
                class="progress-bar"
                type="range"
                value="50"
                min="0"
                max="100"
                step="1" />
              <!-- </div> -->
              <span class="time">3:45</span>
            </div>
          </div>
        </div>

        <div class="player-right">
          <!-- TODO: Responsive volume slider -->
          <div class="volume-control">
            <i class="fas fa-volume-high"></i>
            <input
              type="range"
              class="volume-slider"
              min="0"
              max="100"
              value="80"
              step="1" />
          </div>
        </div>
      </div>

      <!-- Overlay -->
      <div class="sidebar-overlay"></div>
    </div>
  </body>
</html>
